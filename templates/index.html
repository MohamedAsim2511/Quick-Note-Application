<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Note App</title>
    <meta name="description" content="A clean and modern note-taking application">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="page-bg"></div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>Quick Note App</h1>
            <p class="subtitle">Jot down your thoughts, ideas, and reminders</p>
        </header>

        <!-- Note Input Section -->
        <section class="input-section">
            <div class="input-card">
                <div class="input-header">
                    <span class="input-label">New Note</span>
                    <span id="char-counter" class="char-counter">0 / 2000</span>
                </div>
                <textarea
                    id="note-textarea"
                    placeholder="What's on your mind? Type your note here..."
                    maxlength="2000"
                ></textarea>
                <div class="input-footer">
                    <button id="save-btn" class="save-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                        Save Note
                    </button>
                </div>
            </div>
        </section>

        <!-- Notes List Section -->
        <section class="notes-section">
            <div class="section-header">
                <h2>Saved Notes</h2>
                <span id="notes-count" class="notes-count">0 notes</span>
            </div>
            <div id="notes-list" class="notes-list">
                <!-- Notes will be inserted here -->
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>Quick Note App &middot; Built with Flask &amp; SQLite</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
